<html lang="en">
  <body>
    <div id="all" style="display: flex; flex-direction: row;">
      <div id="controls"
	   style="display: flex; flex-direction: column; flex: 0 0 140px">
	<button id="generateBtn">Generate Terrain</button>
	<button id="regenerateBtn">Regenerate (new seed)</button>
	<p id="info" style="font-size: 11px; margin: 8px 0; color: #555;"></p>
	<p id="status" style="font-size: 10px; color: #888;"></p>
      </div>
      <div id="map" style="margin-left:10px; width:600px; height:600px; overflow:auto; border:1px solid #ccc; display:flex; align-items:flex-start;">
	<canvas id="canvas"></canvas>
      </div>
    </div>
    <script src="Libraries/d3.js"></script>
    <script type="module">
      import Terrain from './terrain.js';
      var generateBtn = document.getElementById("generateBtn");
      var regenerateBtn = document.getElementById("regenerateBtn");
      var info = document.getElementById("info");
      var status = document.getElementById("status");
       var container = window.d3.select("#map");

      function updateInfo(config) {
	  info.innerHTML = `Size: ${config.size}px<br>
River count: ${config.riverCount}<br>
Moisture: ${config.moisture.toFixed(2)}<br>
Contours: ${config.contourInterval}<br>
Seed: ${config.seed}`;
      }

      generateBtn.onclick = function () {
	  status.textContent = "Generating…";
	  Terrain.test(container).then(config => {
	      updateInfo(config);
	      status.textContent = "Done";
	      setTimeout(() => status.textContent = "", 1500);
	  });
      };

      regenerateBtn.onclick = function () {
	  status.textContent = "Regenerating…";
	  Terrain.cancel && Terrain.cancel();
	  Terrain.test(container).then(config => {
	      updateInfo(config);
	      status.textContent = "Done";
	      setTimeout(() => status.textContent = "", 1500);
	  });
      };
    </script>
  </body>
</html>
