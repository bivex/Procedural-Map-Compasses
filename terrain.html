<html lang="en">
  <body>
    <div id="all" style="display: flex; flex-direction: row;">
      <div id="controls"
	   style="display: flex; flex-direction: column; flex: 0 0 100px">
	<button id="generateBtn">Generate Terrain</button>
	<button id="regenerateBtn">Regenerate (new seed)</button>
	<p id="info" style="font-size: 12px; margin: 10px 0;"></p>
      </div>
      <div id="map" style="margin-left:10px;">
	<svg id="svg" width="600" height="600"></svg>
      </div>
    </div>
    <script src="Libraries/d3.js"></script>
    <script type="module">
      import Terrain from './terrain.js';
      var generateBtn = document.getElementById("generateBtn");
      var regenerateBtn = document.getElementById("regenerateBtn");
      var info = document.getElementById("info");
      var svg = d3.select("#svg");

      generateBtn.onclick = function () {
	  Terrain.test(svg).then(config => {
	      info.innerHTML = `Size: ${config.size}px<br>
River count: ${config.riverCount}<br>
Moisture: ${config.moisture}<br>
Contours every: ${config.contourInterval}<br>
Seed: ${config.seed}`;
	  });
      };

      regenerateBtn.onclick = function () {
	  // Force new seed by reloading rules (could be handled better)
	  info.innerHTML = "Generating with new random seed...";
	  Terrain.test(svg).then(config => {
	      info.innerHTML = `Size: ${config.size}px<br>
River count: ${config.riverCount}<br>
Moisture: ${config.moisture}<br>
Contours every: ${config.contourInterval}<br>
Seed: ${config.seed}`;
	  });
      };
    </script>
  </body>
</html>
