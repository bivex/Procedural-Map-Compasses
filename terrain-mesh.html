<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Terrain Generator</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
        }
        #container {
            display: inline-block;
            background: white;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        button {
            margin-bottom: 10px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
        }
        .info {
            margin-top: 10px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Mesh-based Procedural Terrain</h1>
    <div id="container"></div>
    <div class="info">
        <p>Features: Voronoi mesh, erosion, rivers, territories, cities</p>
        <p>Click "Generate" for a new map</p>
    </div>
    
    <script type="module">
        import TerrainMesh from './terrain-mesh.js';
        
        const containerDiv = document.getElementById('container');
        let currentConfig = null;
        
        async function generate() {
            currentConfig = await TerrainMesh.test(containerDiv);
        }
        
        // Generate on load
        generate();
        
        // Re-generate on click
        containerDiv.addEventListener('click', generate);
    </script>
</body>
</html>
